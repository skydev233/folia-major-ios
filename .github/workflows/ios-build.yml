name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch upstream Folia source
        run: |
          git clone --depth 1 https://github.com/chthollyphile/folia-major.git folia
          echo "Folia @ $(git -C folia rev-parse --short HEAD)"

      - name: Install Folia dependencies
        working-directory: folia
        run: npm ci

      - name: Build Folia web bundle
        working-directory: folia
        env:
          # 从 GitHub Secrets 读取网易云 API 地址
          VITE_NETEASE_API_BASE: ${{ secrets.NETEASE_API_BASE }}
          # 启用 OpenAI 兼容后端 (DeepSeek)
          VITE_AI_PROVIDER: openai
          OPENAI_API_URL: https://api.deepseek.com
          OPENAI_API_MODEL: deepseek-flash
          # 从 GitHub Secrets 读取 DeepSeek Key
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm run build
          test -d dist || { echo "dist missing"; exit 1; }
          echo "web bundle ready"
          # 使用环境变量检查 API 域名是否成功打包进前端，找不到也不会中断
          grep -r "$VITE_NETEASE_API_BASE" dist/assets/ || echo "warning: netease API not found in bundle"

      - name: Install Capacitor and configure
        working-directory: folia
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          cp ../capacitor.config.json capacitor.config.json

      - name: Add iOS platform and sync
        working-directory: folia
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS bundle (for sideloading)
        working-directory: folia/ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App \
              -configuration Release -sdk iphoneos -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          else
            xcodebuild -project App.xcodeproj -scheme App \
              -configuration Release -sdk iphoneos -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R folia/ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -q Folia.ipa Payload
          ls -lh Folia.ipa

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipa-latest"
          gh release create "$TAG" Folia.ipa --clobber \
            --title "Folia IPA (latest)" \
            --notes "Unsigned IPA for sideloading. Backends configured via GitHub Secrets. AI: DeepSeek Flash"
          echo "released tag=$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: Folia-ipa
          path: Folia.ipa
          if-no-files-found: error
